model = "gpt-6.1-sol"
model_reasoning_effort = "low"
model_context_window = 500000
model_auto_compact_token_limit = 900000
personality = "friendly"
plan_mode_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"


approvals_reviewer = "user"
service_tier = "priority"

[features]
fast_mode = true
hooks = true
multi_agent = true
js_repl = false
context_management = true
memories = true
chronicle = true

[agents]
max_threads = 8
max_depth = 4

[tui]
theme = "catppuccin-mocha"
status_line = ["session-id", "model-with-reasoning", "context-used", "project-name"]
resume_cwd = "current"

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = false

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp", "--autoConnect", "--channel=canary"]
enabled = false

[mcp_servers.chrome-devtools.tools.take_snapshot]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.onshape]
url = "https://fs-mcp.labs.onshape.app/mcp"


[[skills.config]]
name = "github:gh-address-comments"
enabled = false

[[skills.config]]
name = "github:gh-fix-ci"
enabled = false

[[skills.config]]
name = "github:github"
enabled = false

[[skills.config]]
name = "github:yeet"
enabled = false
