# Mouse and clipboard support
set -g mouse on
set-option -g set-clipboard on

# Advertise tmux-256color to programs inside tmux
set -g default-terminal "tmux-256color"

# Tell tmux that Ghostty supports truecolor
set -as terminal-overrides ',xterm-ghostty:RGB'

# Enable synchronized output to prevent flicker
set -as terminal-features ",tmux-256color:sync"

set -g focus-events off

# escape-time is the timeout tmux uses to distinguish plain Escape from escape-prefixed keys
# high values (e.g. 100) can cause noticeable lag when exiting insert mode with Escape in vim
# 5-10 is plenty to be safe without any noticeable lag. default in tmux 3.5a is 10
set -sg escape-time 5

# Pass extended keys (Shift+Enter, Ctrl+Enter, etc.) through to applications
set -g extended-keys on
set -g extended-keys-format csi-u

# Yazi - attempt to fix terminal response timeout when running yazi in a tmux popup
#[TODO] this failed to solve the issue, check if these settings are still valuable
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Remap prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Fill gaps in window numbering when a window is closed
set-option -g renumber-windows on

# Prevent programs from changing window names
set-option -g allow-rename off

# set vi-mode
set-window-option -g mode-keys vi

# Use vim keybindings in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open splits and windows in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# ────── Pane, Window, and Session Navigation ──────
#
# PANES: Leader+[h|j|k|l] - Vim style pane selection
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# PANES: Shift+Alt+[up|down|left|right] to switch panes
# bind -n S-M-Left select-pane -L
# bind -n S-M-Right select-pane -R
# bind -n S-M-Up select-pane -U
# bind -n S-M-Down select-pane -D

# ── Support switching panes across tmux and neovim ──
#     * requires christoomey/vim-tmux-navigator
#     * plugins installed in both tmux and nvim
#
# Check if vim/neovim is running in the current pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
#
# When navigating from non-vim pane, set env var so vim knows which edge to focus
# * M-Right = entering vim from left, so vim should focus leftmost split (h)
# * M-Left = entering vim from right, so vim should focus rightmost split (l)
#
# PANES: Alt+[up|down|left|right] to switch panes
bind -n M-Left if-shell "$is_vim" "send-keys M-Left" "set-environment TMUX_NAV_ENTRY l; select-pane -L"
bind -n M-Right if-shell "$is_vim" "send-keys M-Right" "set-environment TMUX_NAV_ENTRY h; select-pane -R"
bind -n M-Up if-shell "$is_vim" "send-keys M-Up" "set-environment TMUX_NAV_ENTRY j; select-pane -U"
bind -n M-Down if-shell "$is_vim" "send-keys M-Down" "set-environment TMUX_NAV_ENTRY k; select-pane -D"

# WINDOWS: Shift+[left|right] to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# WINDOWS: Shift+Alt+[h|l] to switch windows
# bind -n M-H previous-window
# bind -n M-L next-window

# SESSIONS: Shift+[up|down] to switch sessions
bind -n S-Up switch-client -p  
bind -n S-Down switch-client -n

# SESSIONS: Shift+Alt+[left|right] to switch sessions
# bind -n S-M-Left switch-client -p
# bind -n S-M-Right switch-client -n

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# If Claude is running, Enter key should send a newline
# bind-key -n S-Enter if-shell -F '#{m:*claude*,#{pane_current_command}}' \
#   'send-keys "\\enter"' \
#   'send-keys Enter'

# Toggle pane info per-window (unset falls back to global default)
bind q if-shell "[ '#{pane-border-status}' = 'off' ]" \
  "set-option -uw pane-border-status ; set-option -uw pane-border-format" \
  "set-option -w pane-border-status off"

# New Window
bind c display-popup \
  -w 60 -h 3 -T "New Window" \
  -E 'bash -i -c "read -e -p \"Window name: \" name; \
                  if [ -z \"\$name\" ]; then \
                    tmux display-message \"Window creation cancelled\"; \
                    exit 0; \
                  fi; \
                  tmux new-window -c \"#{pane_current_path}\" -n \"\$name\""'

# New Session
bind S display-popup \
  -w 60 -h 3 -T "New Session" \
  -E 'bash -i -c "read -e -p \"Session name: \" name; \
                  if [ -z \"\$name\" ]; then \
                    tmux display-message \"Session creation cancelled\"; \
                    exit 0; \
                  fi; \
                  if tmux has-session -t \"\$name\" 2>/dev/null; then \
                    tmux display-message \"Session already exists: \$name\"; \
                    exit 0; \
                  fi; \
                  tmux new-session -d -s \"\$name\" -c \"#{pane_current_path}\" && \
                  tmux switch-client -t \"\$name\""'

# Rename Window
bind , display-popup \
  -w 60 -h 3 -T "Rename Window" \
  -E 'bash -i -c "current_name=$(tmux display-message -p \"#{window_name}\"); \
                  read -e -i \"\$current_name\" -p \"New window name: \" name; \
                  if [ -z \"\$name\" ]; then \
                    tmux display-message \"Rename cancelled\"; \
                    exit 0; \
                  fi; \
                  tmux rename-window \"\$name\""'

# Move current window to another session (with fzf)
bind M display-popup -E -w 14% -h 14% "\
  tmux list-sessions -F '#{session_name}' | \
  grep -v \"^$(tmux display-message -p '#S')\$\" | \
  fzf --reverse --header='Move window to session:' \
    --bind 'enter:execute(tmux move-window -t {}:)+accept'"

# Move current pane to another window as vertical split (with fzf)
bind m display-popup -E -w 20% -h 40% "\
  tmux list-windows -a -F '#{session_name}:#{window_index}:#{window_name}' | \
  grep -v \"^$(tmux display-message -p '#S:#I')\" | \
  fzf --reverse --header='Join pane to window:' --delimiter=':' \
    --bind 'enter:execute(tmux join-pane -h -t {1}:{2})+accept' \
    --with-nth='1,2,3' --preview=''"

# Open shell popup
bind \\ display-popup -d '#{pane_current_path}' -w 90% -h 90% -E -T "Shell" "TMUX_POPUP=1 zsh"

# Open yazi in popup
bind \; display-popup -d '#{pane_current_path}' -E -w 90% -h 90% -T "Yazi" "TMUX_POPUP=1 yazi"

# Edit Claude config in Neovim
bind C display-popup -d '/Users/bassimshahidy/.claude' -E -w 90% -h 90% -T "Claude Config" "TMUX_POPUP=1 nvim"

# Edit dotfiles config in Neovim
bind Z display-popup -d '/Users/bassimshahidy/dotfiles' -E -w 90% -h 90% -T "Dotfiles Config" "TMUX_POPUP=1 nvim"

# Edit LazyVim Neovim config
bind N display-popup -d '/Users/bassimshahidy/Documents/GitHub/nvim' -E -w 90% -h 90% -T "LazyVim Config" "TMUX_POPUP=1 nvim"

# Set TPM plugin install path to XDG_DATA_HOME (outside dotfiles for Stow compatibility)
# Not currently using this, may update later
# set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'avgvstvs96/tokyo-night-tmux' # my fork of tokyo-night-tmux
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
#[TODO] do we really need a fork of tmux-resurrect? Might be from old testing of ai-tmux
set -g @plugin 'avgvstvs96/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Save a copy of all pane contents, big help when restoring tmux after a crash
#
# Tip for coding agents:
#  * configure statusline to display the session id, it will be
#  * captured in pane contents allowing easy session recovery
set -g @resurrect-capture-pane-contents 'on'

# Theme settings
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_wbg 1
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_music 0
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_hostname 0
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_battery_widget 0

set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_window_id_style hide
set -g @tokyo-night-tmux_pane_id_style hide

# Git status icon customization
set -g @tokyo-night-tmux_git_changed_icon '󰦓'
set -g @tokyo-night-tmux_git_insertions_icon '󰐖'
set -g @tokyo-night-tmux_git_deletions_icon '󰍵'
set -g @tokyo-night-tmux_git_untracked_icon '󰋗'

run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible overrides
set-option -g status-interval 10
set-option -g display-time 1000

# tokyo-night-tmux statusline overrides
# - no blue background behind session/prefix; use blue foreground instead
# - centered window tabs with no icons
# - gray tab separators, with teal separators around the active tab
#
# Format:
#  󰤂 session-name ▒               ▒ window-1 ▒ window-2 ▒ window-3 ▒                ▒ ~/path ▒ git-status ▒ web-git-status ▒
#
set -g status-left '#[fg=#7aa2f7,bg=default,bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[bold,nodim]#S #[fg=#7aa2f7,bg=default,nobold]░ '
set -g window-status-current-format '#[fg=#73daca,bg=default]▒#[fg=#73daca,bg=#1f3a3d,bold] #W #[fg=#73daca,bg=default,nobold]▒'
set -g window-status-format '#{?#{==:#{window_index},#{e|+|:#{active_window_index},1}}, ,#[fg=#414868,bg=default]▒ }#[fg=#a9b1d6,bg=default]#W #{?window_end_flag,#[fg=#414868]#[bg=default]▒,}'
set -g window-status-separator ''
set -g status-justify absolute-centre

# Custom pane border style:
#
# ┌──/ #P / %ID /──────────────────────/ CMD /──┐
# │                                             │
set-option -g pane-border-format '/ ###P / #{pane_id} /#[align=right]/ #{pane_current_command} /'
set-option -gw pane-border-style "fg=#495078"
set-option -g pane-border-status top
