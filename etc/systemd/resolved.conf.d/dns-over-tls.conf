# The eero router answers every port-53 query itself, even ones sent to 1.1.1.1,
# from a cloud cache that can serve stale records for hours. TLS on 853 goes around it.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net 8.8.8.8#dns.google
DNSOverTLS=yes
Domains=~.
