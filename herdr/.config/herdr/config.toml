onboarding = false
[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
status_indicators = "symbols"
[theme]
name = "tokyo-night"

auto_switch = false
[update]
channel = "stable"

[keys]
# Tmux muscle memory
prefix = "ctrl+space"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Tabs ~= tmux windows
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "shift+left"
next_tab = "shift+right"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Workspaces ~= tmux sessions
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+s"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "shift+up"
next_workspace = "shift+down"
switch_workspace = "prefix+shift+1..9"
focus_agent = "ctrl+alt+1..9"

# Prefix pane movement stays as a reliable fallback.
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
close_pane = "prefix+x"
zoom = "prefix+z"
toggle_sidebar = "prefix+b"

# Copy/scrollback and editing
edit_scrollback = "prefix+e"

# Vim-aware Herdr pane navigation. The helper forwards into Neovim when the
# active pane is vim-like, otherwise it focuses the adjacent Herdr pane.
[[keys.command]]
key = "ctrl+left"
type = "shell"
command = "vim-herdr-navigator dispatch left"
description = "vim-aware pane left"

[[keys.command]]
key = "ctrl+down"
type = "shell"
command = "vim-herdr-navigator dispatch down"
description = "vim-aware pane down"

[[keys.command]]
key = "ctrl+up"
type = "shell"
command = "vim-herdr-navigator dispatch up"
description = "vim-aware pane up"

[[keys.command]]
key = "ctrl+right"
type = "shell"
command = "vim-herdr-navigator dispatch right"
description = "vim-aware pane right"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "vim-herdr-navigator dispatch left"
description = "vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "vim-herdr-navigator dispatch down"
description = "vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "vim-herdr-navigator dispatch up"
description = "vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "vim-herdr-navigator dispatch right"
description = "vim-aware pane right"

# Plugins
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "drovr.move-tab"
description = "move tab to workspace"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "drovr.move-pane"
description = "move pane to tab"

# Tmux popup-like utility panes. Herdr command panes close when the command exits.
[[keys.command]]
key = "prefix+backslash"
type = "pane"
command = "zsh"
description = "shell pane"

[[keys.command]]
key = "prefix+semicolon"
type = "pane"
command = "yazi"
description = "yazi"

[[keys.command]]
key = "prefix+shift+c"
type = "pane"
command = "cd ~/.claude && nvim"
description = "edit Claude config"

[[keys.command]]
key = "prefix+shift+z"
type = "pane"
command = "cd ~/dotfiles && nvim"
description = "edit dotfiles"

[[keys.command]]
key = "prefix+shift+n"
type = "pane"
command = "cd ~/Documents/GitHub/nvim && nvim"
description = "edit Neovim config"

[[keys.command]]
key = "prefix+l"
type = "pane"
command = "lazygit"
description = "open lazygit"

# Popup = tmux display-popup: floats over the current layout, closes on exit.
[[keys.command]]
key = "prefix+n"
type = "popup"
command = "nvim"
width = "85%"
height = "85%"
description = "nvim in cwd"

[advanced]
scrollback_limit_bytes = 100000000

[experimental]
pane_history = true
